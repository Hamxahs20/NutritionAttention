// Content Facts is the source of truth for viewing sessions on this origin.
const FACTS_KEY='attention_facts_events_v1';

let channel=null;

function readContentFacts(){
  let raw;try{raw=JSON.parse(localStorage.getItem(FACTS_KEY)||'[]')}catch(e){return []}
  if(!Array.isArray(raw))return [];
  const today=new Date().toDateString();
  return raw.filter(x=>x&&x.watchedMs>=0&&x.startedAt&&new Date(x.startedAt).toDateString()===today)
  .sort((a,b)=>Date.parse(a.startedAt)-Date.parse(b.startedAt))
  .map((x,i)=>{
    const reel=x.reel||{},fast=x.sourceCategory==='brainrot'||x.category==='fast';
    const seconds=Math.round(x.watchedMs/1000),minutes=Math.round(x.watchedMs/60000*10)/10;
    const category=fast?'Fast-scroll':'Learn';
    const rate=fast?1.02:.97;
    return {id:i,time:new Date(x.startedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),

  entries=facts;isDemo=false;return changed;
}
refreshFacts();

const $=(sel)=>document.querySelector(sel), esc=(v)=>String(v??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const total=(items,k)=>items.reduce((a,x)=>a+(Number(x[k])||0),0), mins=()=>total(entries,'mins'), points=()=>total(entries,'points'), perc=(n,d)=>d?Math.round(100*n/d):0;
const weightedSignal=(key)=>perc(entries.reduce((sum,e)=>sum+e.mins*e[key]/100,0),mins());
const avg=(key,items=entries)=>Math.round(items.reduce((a,x)=>a+x.mins*(Number(x[key])||0),0)/(total(items,'mins')||1));
const groups=()=>Object.entries(CATS).map(([name,style])=>({name,...style,mins:entries.filter(e=>e.category===name).reduce((a,x)=>a+x.mins,0)}));
const fmtM=(n)=>n>=60?`${Math.floor(n/60)}h ${String(Math.round(n%60)).padStart(2,'0')}m`:`${Number(n.toFixed(1))}m`;
const dayLabel=()=>new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long'}).format(new Date()).toUpperCase();
const iSpark='<svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M5.5 5.5l13 13M18.5 5.5l-13 13"/></svg>';
function chartSvg(){const values=[72,104,88,95,103,91,points()],days=Array.from({length:7},(_,i)=>new Intl.DateTimeFormat('en-GB',{weekday:'short'}).format(new Date(Date.now()-(6-i)*86400000)));let xs=values.map((_,i)=>18+i*54), yy=v=>105-(Math.max(50,Math.min(145,v))-50)*(88/95), pts=values.map((v,i)=>[xs[i],yy(v)]);let curve=`M ${pts[0][0]} ${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){let p=pts[i],n=pts[i+1],cp1x=p[0]+(n[0]-p[0])*.48,cp2x=p[0]+(n[0]-p[0])*.52;curve+=` C ${cp1x} ${p[1]}, ${cp2x} ${n[1]}, ${n[0]} ${n[1]}`}let refy=yy(100),area=`${curve} L ${pts.at(-1)[0]} 109 L ${pts[0][0]} 109 Z`;return `<svg viewBox="0 0 360 126" role="img" aria-label="Last seven days of weighted attention: ${values.join(', ')} percent. Your reference is 100 percent."><defs><linearGradient id="area-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7daa83" stop-opacity=".35"/><stop offset="1" stop-color="#7daa83" stop-opacity="0"/></linearGradient></defs><line x1="12" x2="342" y1="${refy}" y2="${refy}" stroke="#a8c29c" stroke-dasharray="4 5" stroke-width="1.2"/><text x="343" y="${refy-5}" text-anchor="end">100</text><path d="${area}" fill="url(#area-grad)"/><path d="${curve}" fill="none" stroke="#497954" stroke-width="3" stroke-linecap="round"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="6.5" fill="#dcefb8" stroke="#497954" stroke-width="2.8"/>${days.map((d,i)=>`<text x="${xs[i]}" y="125" text-anchor="middle">${d}</text>`).join('')}</svg>`}
function today(){const totalm=mins(),pt=points(),difference=pt-100,fast=groups().find(x=>x.name==='Fast-scroll'),gs=groups();const status=difference>0?`${difference}% above your<br>daily reference`:difference<0?`${-difference}% below your<br>daily reference`:'Right at your<br>daily reference';let signals=[['AI-like','ai','Generated-looking content','var(--purple)','✳'],['Thirst traps','thirst','Attention-grabbing cues','#f5c8b4','♡'],['Learning','learning','Educational content','#c4e4be','↗'],['Heavy mood','heavy','Sad or intense themes','#c8dfe9','◌']];return `<section class="screen"><div class="overline">${dayLabel()} ${isDemo?' · DEMO':''}</div><h1 class="headline">What did you feed<br>your <em>mind</em> today?</h1><p class="subhead">A little more awareness. A lot more choice.</p><div class="hero"><div class="card-top"><span class="caps">Daily attention intake</span><span class="ref-chip">reference 100</span></div><div class="hero-summary"><div class="hero-number">${pt}<span>%</span></div><div class="hero-status"><span class="status-dot"></span>${status}</div></div><div class="graph">${chartSvg()}</div><div class="graph-note"><span>Last 7 days <b>·</b> illustrative trend</span><strong>Today's attention →</strong></div></div><div class="section-line"><h2 class="section-title">Your attention plate</h2><span class="section-suffix">${fmtM(totalm)} consumed</span></div><div class="plate-card"><div class="plate-head"><b>What's on your feed?</b><span>By watch time</span></div><div class="segbar" aria-label="Content type distribution">${gs.map(g=>`<span style="width:${perc(g.mins,totalm)}%;background:${g.color}" title="${g.name}: ${perc(g.mins,totalm)}%"></span>`).join('')}</div><div class="legend">${gs.map(g=>`<div class="legend-cell"><i style="background:${g.color}"></i>${g.name}<b>${perc(g.mins,totalm)}%</b></div>`).join('')}</div></div><div class="spotlight"><div class="big">${perc(fast.mins,totalm)}<span>%</span></div><div><div class="text1">Fast-food attention</div><div class="text2">Quick-hit, high-pull scrolling</div></div><div class="spotlight-icon">${iSpark}</div></div><div class="section-line"><h2 class="section-title">Inside your feed</h2><span class="section-suffix">Content signals</span></div><div class="signal-grid">${signals.map(([name,key,desc,bg,icon])=>`<div class="signal"><div class="signal-name">${name}</div><div class="signal-bottom"><div><div class="signal-value">${weightedSignal(key)}<small>%</small></div><div class="signal-desc">${desc}</div></div><div class="color-blob" style="--blob:${bg}">${icon}</div></div></div>`).join('')}</div><p class="footnote">Estimates, not facts. Signals can overlap. AI-like does not mean confirmed AI.</p><div class="checkin"><div class="eyebrow">Your moment of reflection</div><h3>Did your feed feel chosen today?</h3><div class="choices">${['Mostly','Sometimes','Not really'].map(v=>`<button class="choice ${choice===v?'selected':''}" data-choice="${v}" aria-pressed="${choice===v}">${v}</button>`).join('')}</div>${choice?`<div class="checkin-reply">Your reflection is saved on this device. Awareness is a useful first step.</div>`:''}</div></section>`}
function renderCard(e,index){let cat=CATS[e.category]||CATS.Unwind;return `<button class="log-card" data-detail="${index}" style="--cat:${cat.color};--type-bg:${cat.pale}" aria-label="View ${esc(e.title)} nutrition details"><div class="log-top"><div class="platform"><span class="platform-badge">${e.platform==='TikTok'?'♪':'◎'}</span>${esc(e.platform)}</div><div class="time">${esc(e.time)}</div></div><div class="log-main"><strong>${esc(e.title)}</strong><span class="minutes">${e.mins} min</span></div><div class="log-bottom"><span class="tag type">${esc(e.category)}</span><span class="tag">Pull ${e.pull}/5</span><span class="tag">Watch ${e.watch}s</span><span class="log-arrow">›</span></div></button>`}
function logScreen(){let filtered=entries.map((e,index)=>({...e,_index:index})).filter(e=>filter==='All'||e.platform===filter).reverse(),shownmin=total(filtered,'mins');return `<section class="screen"><div class="log-header"><div><div class="overline">YOUR DAILY DIARY ${isDemo?'· DEMO':''}</div><h1 class="headline log-title">Your feed,<br><em>decoded.</em></h1></div><button class="import-btn" id="import-button" aria-label="Import your activity log"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 16V3m0 0L7 8m5-5 5 5M4 15v5h16v-5"/></svg>Import</button><input id="file-import" type="file" accept=".json,application/json" style="display:none" aria-label="Choose activity JSON file"></div><p class="subhead log-intro">Viewing sessions from Content Facts, updated when you return.</p><div class="filterbar" role="group" aria-label="Filter by platform">${['All','TikTok','Instagram'].map(f=>`<button class="filter ${f===filter?'active':''}" data-filter="${f}" aria-pressed="${f===filter}">${f==='All'?'All activity':f}</button>`).join('')}</div><div class="stat-row"><div class="mini-stat"><label>Watch time</label><strong>${fmtM(shownmin)}</strong></div><div class="mini-stat"><label>Avg. video attention</label><strong>${avg('watch',filtered)}<span style="font-size:13px"> sec</span></strong></div></div><div class="timeline-heading"><h3>Activity log</h3><span>${filtered.length} sessions</span></div><div class="timeline">${filtered.length?filtered.map(e=>renderCard(e,e._index)).join(''):'<div class="empty">No sessions in this filter yet.</div>'}</div><div class="integrity"><b>${isDemo?'This is sample data.':'Live from Content Facts on this device.'}</b> Content Facts records are read automatically when both pages use the same website address. Tap a session to see estimated AI likelihood, attention pull, watch time and other content signals.<br><br><button class="linkbutton" id="sample-json">Download sample import format</button>${!isDemo?' · <button class="linkbutton" id="reset-demo">Reset demo</button>':''}</div></section>`}
function bodyIcon(){return `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M10 27c1 9 6 13 14 13s13-4 14-13M8 27h32"/><path d="M19 22c-6-7 1-12 2-15M26 22c-5-7 2-12 3-15M31 24c-2-5 2-7 3-11"/></svg>`}
function brainIcon(){return `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M24 12a8 8 0 0 0-14 6 8 8 0 0 0 0 13 7 7 0 0 0 14 4V12Zm0 0a8 8 0 0 1 14 6 8 8 0 0 1 0 13 7 7 0 0 1-14 4V12Z"/><path d="M16 19c-1 4 1 6 5 6M16 31c3-3 5-2 8-1M32 19c1 4-1 6-5 6M32 31c-3-3-5-2-8-1"/></svg>`}
function mindScreen(){let gs=groups(),tot=mins(),a=0,stops=gs.map(g=>{let start=a;a+=tot?g.mins/tot*100:25;return `${g.color} ${start}% ${a}%`}).join(', ');return `<section class="screen"><div class="overline" style="margin-top:14px">A DIFFERENT KIND OF NUTRITION</div><h1 class="headline">A label for<br>your <em>attention.</em></h1><p class="subhead">You notice what feeds your body. What about your mind?</p><div class="compare"><div class="compare-card"><div class="donut" style="background:conic-gradient(#9bc8a0 0 32%,#e1bd87 32% 57%,#ecc89a 57% 83%,#d2b0d9 83% 100%)"><div class="donut-inner">${bodyIcon()}</div></div><h3>Body</h3><p>Food nutrition</p></div><div class="compare-card"><div class="donut" style="background:conic-gradient(${stops})"><div class="donut-inner">${brainIcon()}</div></div><h3>Mind</h3><p>Attention nutrition</p></div></div><div class="section-line"><h2 class="section-title">The same little questions</h2></div><div class="compare-rows"><div class="compare-row"><span>Ingredients</span><b>↔</b><span>Content</span></div><div class="compare-row"><span>Portions</span><b>↔</b><span>Watch time</span></div><div class="compare-row"><span>Intensity</span><b>↔</b><span>Attention pull</span></div><div class="compare-row"><span>How you feel</span><b>↔</b><span>How you feel</span></div></div><div class="compare-foot"><h3>It's not about a perfect diet. It's about having a choice.</h3><p>Notice the patterns. Question the pull. Decide what deserves your attention next.</p></div><p class="footnote" style="margin-top:13px">This is a design metaphor, not a medical nutrition score. Your 100-point attention reference is personal and adjustable in a future connected version.</p></section>`}
function showDetail(index){let e=entries[index];if(!e)return;let c=CATS[e.category]||CATS.Unwind;let m=[['Attention pull',e.pull*20,`${e.pull} / 5`,'#e99b72'],['AI-like cues',e.ai,`${e.ai}%`,'#b6a9e5'],['Thirst-trap cues',e.thirst,`${e.thirst}%`,'#f1ad97'],['Educational value',e.learning,`${e.learning}%`,'#98cba1'],['Heavy mood',e.heavy,`${e.heavy}%`,'#9cc6d7']];if(e.source==='Content Facts'){m.push(['Positive mood (demo)',Math.min(100,e.mood),`+${e.mood}%`,'#a6d8b1'],['Stimulus (demo)',Math.min(100,e.stimulus/5),`+${e.stimulus}%`,'#e2b06b'],['Capture signal (demo)',Math.min(100,Math.abs(e.capture)),`${e.capture>0?'+':''}${e.capture}%`,'#b8a6d8']);}$('#overlay-root').innerHTML=`<div class="sheet-backdrop" id="sheet-backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-label="Session attention nutrition"><div class="sheet-handle"></div><button class="close-sheet" id="close-sheet" aria-label="Close">×</button><span class="tag type" style="background:${c.pale};color:#59715f">${esc(e.category)}</span><h2>${esc(e.title)}</h2><p class="desc">${esc(e.platform)} · ${esc(e.time)} · ${e.mins} min · avg watch ${e.watch}s</p>${m.map(([n,p,v,color])=>`<div class="measure"><div class="measure-title"><b>${n}</b><span>${v}</span></div><div class="meter" style="--meter:${color}"><div style="width:${p}%"></div></div></div>`).join('')}<div class="sheet-small">These are content-classification estimates from sample data, not verified judgments. Watch attention means average seconds per video, not a measured personal attention span.</div></div></div>`}
function notify(msg){let old=$('.toast');if(old)old.remove();let d=document.createElement('div');d.className='toast';d.textContent=msg;$('#app').append(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),3200)}
function render(){if(presenterMode){const status=$('#presenter-status');if(status)status.textContent=entries.length?`LIVE · ${entries.length} reels · ${Math.round(mins()*10)/10} min viewed`:'LIVE · Waiting for first reel (watch 5s, then swipe)';}const v=$('#view');v.innerHTML=tab==='today'?today():tab==='log'?logScreen():mindScreen();document.querySelectorAll('[data-tab]').forEach(b=>{let active=b.dataset.tab===tab;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false')})}
function switchTo(t){if(tab===t)return;tab=t;render();$('#view').scrollTop=0;}
document.querySelector('.nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)switchTo(b.dataset.tab)});
$('#view').addEventListener('click',e=>{let target=e.target;if(target.closest('[data-choice]')){choice=target.closest('[data-choice]').dataset.choice;try{localStorage.setItem('attention-nutrition-reflection',choice)}catch(x){};render();return}if(target.closest('[data-filter]')){filter=target.closest('[data-filter]').dataset.filter;render();return}if(target.closest('[data-detail]')){showDetail(Number(target.closest('[data-detail]').dataset.detail));return}if(target.closest('#import-button')){$('#file-import').click();return}if(target.closest('#reset-demo')){entries=MOCK.slice();isDemo=true;filter='All';try{localStorage.removeItem(KEY)}catch(x){}render();notify('Sample day restored');return}if(target.closest('#sample-json')){let example=JSON.stringify({entries:[MOCK[0],MOCK[1]]},null,2),blob=new Blob([example],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='attention-nutrition-import-example.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
$('#view').addEventListener('change',async e=>{if(e.target.id!=='file-import')return;let f=e.target.files?.[0];if(!f)return;try{if(f.size>2_000_000)throw Error('File exceeds 2 MB');let json=JSON.parse(await f.text()),arr=Array.isArray(json)?json:json.entries;if(!Array.isArray(arr)||!arr.length||arr.length>3000)throw Error('Expected an entries array (1–3000 sessions)');let cleaned=arr.map((d,i)=>{if(!d||typeof d!=='object')throw Error('Invalid session');let num=(...args)=>{let n=args.find(v=>v!==undefined&&v!==null&&v!=='');return Number(n)};let category=CATS[d.category]?d.category:'Unwind';let mm=num(d.mins,d.minutes,d.durationMinutes,d.duration_minutes);if(!Number.isFinite(mm)||mm<0||mm>1440)throw Error('Each session needs valid mins');let bound=(n,max,def)=>Number.isFinite(n)?Math.max(0,Math.min(max,n)):def;let pp=num(d.points,d.attentionPoints);return{id:i,time:String(d.time??'—').slice(0,12),platform:d.platform==='Instagram'?'Instagram':'TikTok',title:String(d.title??'Untitled content').slice(0,65),category,mins:Math.round(mm),points:Math.round(Number.isFinite(pp)?bound(pp,2000,0):mm*({"Fast-scroll":1.02,"Learn":.97,"Connect":.78,"Unwind":.56}[category])),pull:bound(num(d.pull,d.addictiveness),5,2),watch:Math.round(bound(num(d.watch,d.watchSeconds),600,30)),ai:bound(num(d.ai,d.aiLikelihood),100,0),thirst:bound(num(d.thirst,d.thirstTrap),100,0),learning:bound(num(d.learning,d.educational),100,0),heavy:bound(num(d.heavy,d.sadness),100,0)}});entries=cleaned;isDemo=false;filter='All';try{localStorage.setItem(KEY,JSON.stringify({entries}))}catch(x){}render();notify(`${entries.length} sessions imported to this device`)}catch(err){notify('Import failed: '+err.message)}});
$('#overlay-root').addEventListener('click',e=>{if(e.target.id==='sheet-backdrop'||e.target.closest('#close-sheet'))$('#overlay-root').innerHTML=''});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#overlay-root').innerHTML=''});

}
